; PlatformIO Project Configuration File

[env:wassertank_sender]
platform = espressif32
monitor_speed = 115200
board = heltec_wifi_lora_32_V3
framework = arduino
src_filter =
    +<main_sender.cpp>

lib_deps =
    ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
    olikraus/U8g2 @ ^2.35.19

[env:wassertank_receiver]
platform = espressif32
monitor_speed = 115200
board = heltec_wifi_lora_32_V3
framework = arduino
src_filter =
    +<main_receiver.cpp>
build_flags =
    -D SERVER_HOST=\"your-server-host.example.com\"
    -D SERVER_API_KEY=\"your-api-key\"

lib_deps =
    ropg/Heltec_ESP32_LoRa_v3 @ ^0.9.2
    olikraus/U8g2 @ ^2.35.19